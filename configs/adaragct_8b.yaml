# AdaRAG-CT 8B — RAG-token training (oracle_ratio=0.7, no_context_rate=0.0)

experiment:
  name: "adaragct_8b"
  seed: 42

device:
  type: "cuda"

paths:
  output_dir: "results/train/adaragct_8b_{datetime}"

model:
  model_path: "results/base_8b/checkpoint"
  model_name: "llava-llama"
  use_flash_attn: false
  gradient_checkpointing: true
  train_projector_only: false
  pretrain_checkpoint: "results/base_8b/checkpoint"
  freeze_projector: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: ["down_proj", "gate_proj", "k_proj", "o_proj", "q_proj", "up_proj", "v_proj"]
  projector_type: "independent"
  projector_layers: 2
  tokens_per_embedding: 1

data:
  train_embeddings_npz: "data/embeddings/visd_boost/train_embeds.npz"
  val_embeddings_npz: "data/embeddings/visd_boost/valid_embeds.npz"
  val_organ_reports_json: "data/annotations/valid_organ_reports.json"
  whole_ct_key: "ct_clip_max"
  whole_ct_dim: 512
  whole_ct_embeddings_npz_train: "data/embeddings/ct_clip/train_embeds.npz"
  whole_ct_embeddings_npz_val: "data/embeddings/ct_clip/valid_embeds.npz"
  organ_keys: ["lung", "heart", "esophagus", "aorta"]
  train_reports_csv: "data/annotations/train_reports.csv"
  oracle_context_jsonl: "data/oracle/oracle_context_top3.jsonl"
  real_context_jsonl: "data/retrieval/retrieval_context_top3.jsonl"
  batch_size: 8
  num_workers: 4
  use_chat_template: true
  system_prompt: "detailed"

rag_token:
  no_context_rate: 0.0        # all samples get context
  oracle_ratio: 0.7           # real_rag = 1 - 0.0 - 0.7 = 0.3
  max_rag_per_sample: 4

training:
  max_steps: 10000
  save_every: 500
  optimizer:
    type: "adamw"
    lr: 1.0e-5
    weight_decay: 0.05
    betas: [0.9, 0.999]
    eps: 1.0e-8
  scheduler:
    type: "warmup_cosine"
    warmup_steps: 200
    min_lr_ratio: 0.01
  grad_accum_steps: 2
  max_seq_length_by_task:
    report_generation: 4096
  use_amp: true

logging:
  use_console: true
  log_every: 10
